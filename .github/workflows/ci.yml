name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Test native app, Vision, and local upload
        env:
          # Intel hosted VMs crash inside SwiftUI's Metal renderer. All functional tests still run.
          SCREENZ_SKIP_PREVIEWS: ${{ matrix.runner == 'macos-15-intel' && '1' || '0' }}
        run: zsh scripts/test.sh
  package:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build universal app, DMG, and ZIP
        run: zsh scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Screenz-universal-development
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
